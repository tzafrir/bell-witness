name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyflakes
      - name: lint
        run: python -m pyflakes src scripts tests reproduce.py
      - name: synthetic known-answer suite (no data downloads in CI)
        run: python -m pytest -q tests/
